name: Build Android APK (Roleta Quant Lab)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm install --no-save @capacitor/cli@^8.6.2 @capacitor/android@^8.6.2
          npm run build

      - name: Initialize Capacitor Android & copy native plugin
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          mkdir -p android/app/src/main/java/ao/roletaquant/lab
          cp android-plugin/RouletteSplitBrowserPlugin.java android/app/src/main/java/ao/roletaquant/lab/RouletteSplitBrowserPlugin.java
          cp android-plugin/MainActivity.java android/app/src/main/java/ao/roletaquant/lab/MainActivity.java
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roleta-quant-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
