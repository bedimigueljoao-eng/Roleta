name: Build Android APK (Roleta Quant Lab)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build

      - name: Initialize Capacitor Android & copy native plugin
        run: |
          npm install @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          mkdir -p android/app/src/main/java/ao/roletaquant/lab
          cp android-plugin/RouletteSplitBrowserPlugin.kt android/app/src/main/java/ao/roletaquant/lab/RouletteSplitBrowserPlugin.kt
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roleta-quant-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
